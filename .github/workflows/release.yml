name: Module Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-module:
    # Triggers automatic semantic versioning and terraform-docs updates
    uses: Chruese/ci-cd-templates/.github/workflows/terraform-module-release.yml@main
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
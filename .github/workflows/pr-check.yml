name: Module PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-module:
    # Uses your central CI/CD templates repository
    uses: Chruese/ci-cd-templates/.github/workflows/terraform-pr-gatekeeper.yml@main
    with:
      # Validates the module by running a plan against the example configuration
      working-dir: "./examples/default"
      terraform-version: "1.8.0"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}